# 本地测试补丁：把 web-mirror 插件叠加进 dsh web profile。
# 用 `dsh web --patch /Users/leici/workspace/dsh-web-mirror/cordis.patch.yml` 启动时生效；
# 或把这段 insert 合并进 ~/.dsh/profiles/web/cordis.patch.yml 让当前实例热加载。
#
# name 用绝对路径，避免依赖 ~/.dsh/profiles/web/node_modules 里的解析。
- insert:
    - id: web-mirror
      name: /Users/leici/workspace/dsh-web-mirror/lib/index.js
      config:
        host: '127.0.0.1'
        port: 3180

# 启用 HMR 并监听本插件的编译产物。base 相对 profile 目录解析，故用绝对路径。
# 改 src/ 后跑 `pnpm dev`（tsc --watch）刷新 lib/，hmr 检测到变化即重载插件：
# dispose 旧 fiber（关 listener）→ 重新 apply（重新 listen），无需重启 dsh。
# 注意：dsh 必须以 `node --expose-internals <bin.js>` 启动，否则 hmr 抛错。
# 见 package.json 的 start:hmr 脚本。
- id: hmr
  disabled: false
  config:
    base: /Users/leici/workspace/dsh-web-mirror
    root: ['lib']
    debounce: 100
